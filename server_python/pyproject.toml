[project]
name = "server-python"
version = "0.1.0"
description = "Python server for AI audio synthesis"
readme = "README.md"
authors = [
    { name = "Luiz Wendel", email = "alexandre.lawb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
server-python = "server_python:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
